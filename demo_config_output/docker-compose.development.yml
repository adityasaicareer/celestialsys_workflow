# Docker Compose Configuration - DEVELOPMENT
# Generated by Workflow Configuration System

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_development
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
    env_file:
      - ./backend/.env.development
    depends_on:
      - postgres
      - mongo
    networks:
      - app_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_development
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_ENVIRONMENT=development
    env_file:
      - ./frontend/.env.development
    depends_on:
      - backend
    networks:
      - app_network
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: postgres_development
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_development:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: mongo_development
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB}
    volumes:
      - mongo_data_development:/data/db
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data_development:
  mongo_data_development: