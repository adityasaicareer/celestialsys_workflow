version: '3.8'

services:
  # Frontend Service (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workflow_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=dev
    depends_on:
      - backend
    networks:
      - workflow_network
    restart: unless-stopped

  # Backend Service (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workflow_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=dev
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=app_db
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=MTWwuS&ld6uyD!rnCReW$8PZ6TcY@rT6
      - DATABASE_URL=postgresql://app_user:MTWwuS&ld6uyD!rnCReW$8PZ6TcY@rT6@postgres:5432/app_db
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB=app_db
      - MONGO_USER=app_user
      - MONGO_PASSWORD=JHNjckVc$b0YutzDw#p8YqCrvK$tNKa8
      - MONGO_URL=mongodb://app_user:JHNjckVc$b0YutzDw#p8YqCrvK$tNKa8@mongo:27017/app_db?authSource=admin
    depends_on:
      - postgres
      - mongo
    networks:
      - workflow_network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: workflow_postgres
    environment:
      - POSTGRES_DB=app_db
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=MTWwuS&ld6uyD!rnCReW$8PZ6TcY@rT6
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - workflow_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: workflow_mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=app_user
      - MONGO_INITDB_ROOT_PASSWORD=JHNjckVc$b0YutzDw#p8YqCrvK$tNKa8
      - MONGO_INITDB_DATABASE=app_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - workflow_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

# Docker Networks
networks:
  workflow_network:
    driver: bridge
    name: workflow_network

# Persistent Volumes
volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local